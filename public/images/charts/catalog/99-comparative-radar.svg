<svg xmlns="http://www.w3.org/2000/svg" class="ts-chart" width="100%" height="100%" viewBox="0 0 288 192" role="img" aria-roledescription="chart" aria-label="Comparative radar chart" tabindex="-1" style="display:block;overflow:visible"><style>.ts-chart__legend{display:none}.ts-chart text{font-size:9px}:root{--ts-chart-background:#ffffff;--ts-chart-foreground:#071219;--ts-chart-muted:#667c87;--ts-chart-1:#2497bd;--ts-chart-2:#e46244;--ts-chart-3:#39a84b;--ts-chart-4:#805ad5;--ts-chart-5:#e69a16;--ts-chart-6:#667c87;color:#071219}.ts-chart__grid{stroke:#071219;stroke-opacity:0.1}.ts-chart__axes line,.ts-chart__axes path{stroke:#071219;stroke-opacity:0.32}.ts-chart__axes text{fill:#071219;fill-opacity:0.6}@media(prefers-color-scheme:dark){:root{--ts-chart-background:#071219;--ts-chart-foreground:#d9edf1;--ts-chart-muted:#91a9b4;--ts-chart-1:#61e8ff;--ts-chart-2:#ff806f;--ts-chart-3:#b9f227;--ts-chart-4:#c4a7ff;--ts-chart-5:#ffd85e;--ts-chart-6:#91a9b4;color:#d9edf1}.ts-chart__grid{stroke:#d9edf1;stroke-opacity:0.13}.ts-chart__axes line,.ts-chart__axes path{stroke:#d9edf1;stroke-opacity:0.28}.ts-chart__axes text{fill:#d9edf1;fill-opacity:0.62}}</style><g data-ts-key="marks" class="ts-chart__marks"><g data-ts-key="polar-0" class="ts-chart__polar" aria-hidden="true" transform="translate(169 96)"><g data-ts-key="polar-0:radial-grid-0" class="ts-chart__radial-grid" aria-hidden="true"><path data-ts-key="ring:number:0.2" fill="none" stroke="#cbd5e1" stroke-width="1" d="M0,-9.984L9.984,0L0,9.984L-9.984,0Z" vector-effect="non-scaling-stroke"/><path data-ts-key="ring:number:0.4" fill="none" stroke="#cbd5e1" stroke-width="1" d="M0,-19.968L19.968,0L0,19.968L-19.968,0Z" vector-effect="non-scaling-stroke"/><path data-ts-key="ring:number:0.6" fill="none" stroke="#cbd5e1" stroke-width="1" d="M0,-29.952L29.952,0L0,29.952L-29.952,0Z" vector-effect="non-scaling-stroke"/><path data-ts-key="ring:number:0.8" fill="none" stroke="#cbd5e1" stroke-width="1" d="M0,-39.936L39.936,0L0,39.936L-39.936,0Z" vector-effect="non-scaling-stroke"/><path data-ts-key="ring:number:1" fill="none" stroke="#cbd5e1" stroke-width="1" d="M0,-49.92L49.92,0L0,49.92L-49.92,0Z" vector-effect="non-scaling-stroke"/></g><g data-ts-key="polar-0:angle-grid-1" class="ts-chart__angle-grid" aria-hidden="true"><line data-ts-key="spoke:string:10:100 Meters" stroke="#cbd5e1" stroke-width="1" x1="0" y1="0" x2="0" y2="-49.92"/><line data-ts-key="spoke:string:9:Long Jump" stroke="#cbd5e1" stroke-width="1" x1="0" y1="0" x2="49.92" y2="0"/><line data-ts-key="spoke:string:9:High Jump" stroke="#cbd5e1" stroke-width="1" x1="0" y1="0" x2="0" y2="49.92"/><line data-ts-key="spoke:string:17:100 Meter Hurdles" stroke="#cbd5e1" stroke-width="1" x1="0" y1="0" x2="-49.92" y2="0"/></g><g data-ts-key="country-profiles" class="ts-chart__radial-area ts-chart__radar" aria-hidden="true"><path data-ts-key="country-profiles:string:3:USA" fill="#7c3aed" fill-opacity="0.18" stroke-linejoin="round" d="M0,-39.411L49.92,0L0,27.542L-33.28,0ZM0,0L0,0L0,0L0,0Z" vector-effect="non-scaling-stroke"/><path data-ts-key="country-profiles:string:3:GBR" fill="#0ea5e9" fill-opacity="0.18" stroke-linejoin="round" d="M0,-38.885L46.527,0L0,20.657L-19.075,0ZM0,0L0,0L0,0L0,0Z" vector-effect="non-scaling-stroke"/></g><g data-ts-key="polar-0:radial-grid-0:labels" class="ts-chart__text" aria-hidden="true"><text data-ts-key="radius-label:number:0.2" fill="#cccccc" x="8.65" y="-4.99" text-anchor="start" dominant-baseline="auto" transform="rotate(60 8.65 -4.99)" font-size="12" font-family="inherit">20</text><text data-ts-key="radius-label:number:0.4" fill="#cccccc" x="17.29" y="-9.98" text-anchor="start" dominant-baseline="auto" transform="rotate(60 17.29 -9.98)" font-size="12" font-family="inherit">40</text><text data-ts-key="radius-label:number:0.6" fill="#cccccc" x="25.94" y="-14.98" text-anchor="start" dominant-baseline="auto" transform="rotate(60 25.94 -14.98)" font-size="12" font-family="inherit">60</text><text data-ts-key="radius-label:number:0.8" fill="#cccccc" x="34.59" y="-19.97" text-anchor="start" dominant-baseline="auto" transform="rotate(60 34.59 -19.97)" font-size="12" font-family="inherit">80</text><text data-ts-key="radius-label:number:1" fill="#cccccc" x="43.23" y="-24.96" text-anchor="start" dominant-baseline="auto" transform="rotate(60 43.23 -24.96)" font-size="12" font-family="inherit">100</text></g><g data-ts-key="polar-0:angle-grid-1:labels" class="ts-chart__text" aria-hidden="true"><text data-ts-key="angle-label:string:10:100 Meters" fill="#808080" x="0" y="-57.92" text-anchor="middle" dominant-baseline="auto" transform="rotate(0 0 -57.92)" font-size="12" font-family="inherit">100 Meters</text><text data-ts-key="angle-label:string:9:Long Jump" fill="#808080" x="57.92" y="1.1" text-anchor="start" dominant-baseline="middle" transform="rotate(0 57.92 1.1)" font-size="12" font-family="inherit">Long Jump</text><text data-ts-key="angle-label:string:9:High Jump" fill="#808080" x="0" y="56.82" text-anchor="middle" dominant-baseline="hanging" transform="rotate(0 0 56.82)" font-size="12" font-family="inherit">High Jump</text><text data-ts-key="angle-label:string:17:100 Meter Hurdles" fill="#808080" x="-57.92" y="1.1" text-anchor="end" dominant-baseline="middle" transform="rotate(0 -57.92 1.1)" font-size="12" font-family="inherit">100 Meter Hurdles</text></g></g></g></svg>