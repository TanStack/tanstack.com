yer ts-chart__focus-layer--default" aria-hidden="true" data-ts-focus-layer="over" visibility="hidden"><circle data-ts-key="penguins:object:null:number:181" fill="var(--ts-chart-focus-fill, Canvas)" stroke="#2563eb" stroke-width="2.5" cx="101.17" cy="117" r="5"/><circle data-ts-key="penguins:object:null:number:174" fill="var(--ts-chart-focus-fill, Canvas)" stroke="#2563eb" stroke-width="2.5" cx="80.06" cy="132.4" r="5"/><circle data-ts-key="penguins:object:null:number:178" fill="var(--ts-chart-focus-fill, Canvas)" stroke="#2563eb" stroke-width="2.5" cx="92.12" cy="139" r="5"/><circle data-ts-key="penguins:object:null:number:196" fill="var(--ts-chart-focus-fill, Canvas)" stroke="#2563eb" stroke-width="2.5" cx="146.4" cy="110.4" r="5"/><circle data-ts-key="penguins:object:null:number:230" fill="var(--ts-chart-focus-fill, Canvas)" stroke="#2563eb" stroke-width="2.5" cx="248.92" cy="31.2" r="5"/></g></svg>