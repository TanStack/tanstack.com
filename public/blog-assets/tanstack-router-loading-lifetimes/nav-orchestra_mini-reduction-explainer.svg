<svg xmlns="http://www.w3.org/2000/svg" width="640" height="262" viewBox="0 0 640 262" role="img" aria-labelledby="mre-title mre-desc">
  <title id="mre-title">Two loader outcomes reduce to one lane result</title>
  <desc id="mre-desc">
    The layout loader settles first with an error, and the index loader settles
    later with a redirect to login. Both outcomes return to the private settings
    lane, which reduces them into a single result: the redirect, which becomes
    the next lane.
  </desc>
  <style>
    :root {
      background-color: #fdfdfd;
    }

    text {
      fill: #4c4c4c;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 14px;
    }

    .mono {
      font-family: ui-monospace, "Monaspace Neon NF", Menlo, monospace;
    }

    .note {
      font-size: 12.5px;
    }

    .tick {
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    .bar {
      fill: none;
      stroke-width: 9;
      stroke-linecap: round;
    }

    .link {
      fill: none;
      stroke: #a7a7a7;
      stroke-width: 1.6;
    }

    .node {
      fill: #0a0a0a;
      stroke-width: 4;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        background-color: #0a0a0a;
      }

      text {
        fill: #b3b3b3;
      }
    }
  </style>
  <defs>
    <marker id="mre-arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#a7a7a7" />
    </marker>
    <marker id="mre-arrow-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#60d9d8" />
    </marker>
  </defs>

  <text class="tick" x="620" y="26" text-anchor="end">TIME →</text>

  <!-- layout loader -->
  <text x="150" y="65" text-anchor="end">layout loader</text>
  <path class="bar" stroke="#e2b027" d="M180 60h120" />
  <circle class="node" stroke="#e2b027" cx="300" cy="60" r="6" />
  <text class="mono" x="318" y="56">error</text>
  <text class="note" x="318" y="76">settles first, held as provisional</text>

  <!-- index loader -->
  <text x="150" y="130" text-anchor="end">index loader</text>
  <path class="bar" stroke="#e2b027" d="M180 125h210" />
  <circle class="node" stroke="#e2b027" cx="390" cy="125" r="6" />
  <text class="mono" x="408" y="121">redirect('/login')</text>
  <text class="note" x="408" y="141">control flow, not a page</text>

  <!-- outcomes returning to the lane -->
  <path class="link" marker-end="url(#mre-arrow-grey)" d="M300 70c0 78 96 46 128 122" />
  <path class="link" marker-end="url(#mre-arrow-grey)" d="M390 135c0 38 42 20 48 57" />

  <!-- settings lane -->
  <text x="150" y="211" text-anchor="end">/settings lane</text>
  <path class="bar" stroke="#60d9d8" marker-end="url(#mre-arrow-cyan)" d="M180 206h414" />
  <circle class="node" stroke="#60d9d8" cx="440" cy="206" r="6" />
  <circle class="node" stroke="#60d9d8" cx="180" cy="206" r="6" />
  <text class="note mono" x="546" y="190" text-anchor="middle">→ /login lane</text>
  <text class="note" x="420" y="238" text-anchor="middle">one result for the whole route</text>
</svg>
