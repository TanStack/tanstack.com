<svg xmlns="http://www.w3.org/2000/svg" class="ts-chart" width="100%" height="100%" viewBox="0 0 288 192" role="img" aria-roledescription="chart" aria-label="Palmer penguins by species and sex" tabindex="-1" style="display:block;overflow:visible"><style>.ts-chart__legend{display:none}.ts-chart text{font-size:9px}:root{--ts-chart-background:#ffffff;--ts-chart-foreground:#071219;--ts-chart-muted:#667c87;--ts-chart-1:#2497bd;--ts-chart-2:#e46244;--ts-chart-3:#39a84b;--ts-chart-4:#805ad5;--ts-chart-5:#e69a16;--ts-chart-6:#667c87;color:#071219}.ts-chart__grid{stroke:#071219;stroke-opacity:0.1}.ts-chart__axes line,.ts-chart__axes path{stroke:#071219;stroke-opacity:0.32}.ts-chart__axes text{fill:#071219;fill-opacity:0.6}@media(prefers-color-scheme:dark){:root{--ts-chart-background:#071219;--ts-chart-foreground:#d9edf1;--ts-chart-muted:#91a9b4;--ts-chart-1:#61e8ff;--ts-chart-2:#ff806f;--ts-chart-3:#b9f227;--ts-chart-4:#c4a7ff;--ts-chart-5:#ffd85e;--ts-chart-6:#91a9b4;color:#d9edf1}.ts-chart__grid{stroke:#d9edf1;stroke-opacity:0.13}.ts-chart__axes line,.ts-chart__axes path{stroke:#d9edf1;stroke-opacity:0.28}.ts-chart__axes text{fill:#d9edf1;fill-opacity:0.62}}</style><g data-ts-key="grid" class="ts-chart__grid" aria-hidden="true" stroke="currentColor" stroke-opacity="0.11" stroke-width="1"><line data-ts-key="x-grid:number:-50" x1="115.25" y1="20" x2="115.25" y2="122"/><line data-ts-key="x-grid:number:0" x1="174" y1="20" x2="174" y2="122"/><line data-ts-key="x-grid:number:50" x1="232.75" y1="20" x2="232.75" y2="122"/></g><g data-ts-key="marks" class="ts-chart__marks"><g data-ts-key="population-bars" class="ts-chart__bar ts-chart__bar-x" aria-hidden="true"><rect data-ts-key="population-bars:string:4:MALE:string:11:Adelie:MALE" fill="#2563eb" x="88.23" y="20.84" width="85.78" height="32.32"/><rect data-ts-key="population-bars:string:6:FEMALE:string:13:Adelie:FEMALE" fill="#db2777" x="174" y="20.84" width="85.78" height="32.32"/><rect data-ts-key="population-bars:string:6:FEMALE