<svg xmlns="http://www.w3.org/2000/svg" class="ts-chart" width="100%" height="100%" viewBox="0 0 288 192" role="img" aria-roledescription="chart" aria-label="Decathlon radar chart" tabindex="-1" style="display:block;overflow:visible"><style>.ts-chart__legend{display:none}.ts-chart text{font-size:9px}:root{--ts-chart-background:#ffffff;--ts-chart-foreground:#071219;--ts-chart-muted:#667c87;--ts-chart-1:#2497bd;--ts-chart-2:#e46244;--ts-chart-3:#39a84b;--ts-chart-4:#805ad5;--ts-chart-5:#e69a16;--ts-chart-6:#667c87;color:#071219}.ts-chart__grid{stroke:#071219;stroke-opacity:0.1}.ts-chart__axes line,.ts-chart__axes path{stroke:#071219;stroke-opacity:0.32}.ts-chart__axes text{fill:#071219;fill-opacity:0.6}@media(prefers-color-scheme:dark){:root{--ts-chart-background:#071219;--ts-chart-foreground:#d9edf1;--ts-chart-muted:#91a9b4;--ts-chart-1:#61e8ff;--ts-chart-2:#ff806f;--ts-chart-3:#b9f227;--ts-chart-4:#c4a7ff;--ts-chart-5:#ffd85e;--ts-chart-6:#91a9b4;color:#d9edf1}.ts-chart__grid{stroke:#d9edf1;stroke-opacity:0.13}.ts-chart__axes line,.ts-chart__axes path{stroke:#d9edf1;stroke-opacity:0.28}.ts-chart__axes text{fill:#d9edf1;fill-opacity:0.62}}</style><g data-ts-key="marks" class="ts-chart__marks"><g data-ts-key="polar-0" class="ts-chart__polar" aria-hidden="true" transform="translate(169 96)"><g data-ts-key="polar-0:radial-grid-0" class="ts-chart__radial-grid" aria-hidden="true"><path data-ts-key="ring:number:0.2" fill="none" stroke="#cbd5e1" stroke-width="1" d="M0,-10.24L10.24,0L0,10.24L-10.24,0Z" vector-effect="non-scaling-stroke"/><path data-ts-key="ring:number:0.4" fill="none" stroke="#cbd5e1" stroke-width="1" d="M0,-20.48L20.48,0L0,20.48L-20.48,0Z" vector-effect="non-scaling-stroke"/><path data-ts-key="ring:number:0.6" fill="none" stroke="#cbd5e1" stroke-width="1" d="M0,-30.72L30.72,0L0,30.72L-30.72,0Z" vector-effect="non-scaling-stroke"/><path data-ts-key="ring:number:0.8" fill="none" stroke="#cbd5e1" stroke-width="1" d="M0,-40.96L40.96,0L0,40.96L-40.96,0Z" vector-effect="non-scaling-stroke"/><path data-ts-key="ring:number:1" fill="none" stroke="#cbd5e1" stroke-width="1" d="M0,-51.2L51.2,0L0,51.2L-51.2,0Z" vector-effect="non-scaling-stroke"/></g><g data-ts-key="polar-0:angle-grid-1" class="ts-chart__angle-grid" aria-hidden="true"><line data-ts-key="spoke:string:10:100 Meters" stroke="#cbd5e1" stroke-width="1" x1="0" y1="0" x2="0" y2="-51.2"/><line data-ts-key="spoke:string:9:Long Jump" stroke="#cbd5e1" stroke-width="1" x1="0" y1="0" x2="51.2" y2="0"/><line data-ts-key="spoke:string:9:High Jump" stroke="#cbd5e1" stroke-width="1" x1="0" y1="0" x2="0" y2="51.2"/><line data-ts-key="spoke:string:17:100 Meter Hurdles" stroke="#cbd5e1" stroke-width="1" x1="0" y1="0" x2="-51.2" y2="0"/></g><g data-ts-key="athlete-profile" class="ts-chart__radial-area ts-chart__radar" aria-hidden="true"><path data-ts-key="athlete-profile:object:null" fill="#8884d8" fill-opacity="0.6" stroke="#8884d8" stroke-width="2" stroke-linejoin="round" d="M0,-40.421L51.2,0L0,28.248L-34.133,0ZM0,0L0,0L0,0L0,0Z" vector-effect="non-scaling-stroke"/></g><g data-ts-key="polar-0:radial-grid-0:labels" class="ts-chart__text" aria-hidden="true"><text data-ts-key="radius-label:number:0.2" fill="#cccccc" x="8.87" y="-5.12" text-anchor="start" dominant-baseline="auto" transform="rotate(60 8.87 -5.12)" font-size="12" font-family="inherit">20</text><text data-ts-key="radius-label:number:0.4" fill="#cccccc" x="17.74" y="-10.24" text-anchor="start" dominant-baseline="auto" transform="rotate(60 17.74 -10.24)" font-size="12" font-family="inherit">40</text><text data-ts-key="radius-label:number:0.6" fill="#cccccc" x="26.6" y="-15.36" text-anchor="start" dominant-baseline="auto" transform="rotate(60 26.6 -15.36)" font-size="12" font-family="inherit">60</text><text data-ts-key="radius-label:number:0.8" fill="#cccccc" x="35.47" y="-20.48" text-anchor="start" dominant-baseline="auto" transform="rotate(60 35.47 -20.48)" font-size="12" font-family="inherit">80</text><text data-ts-key="radius-label:number:1" fill="#cccccc" x="44.34" y="-25.6" text-anchor="start" dominant-baseline="auto" transform="rotate(60 44.34 -25.6)" font-size="12" font-family="inherit">100</text></g><g data-ts-key="polar-0:angle-grid-1:labels" class="ts-chart__text" aria-hidden="true"><text data-ts-key="angle-label:string:10:100 Meters" fill="#808080" x="0" y="-59.2" text-anchor="middle" dominant-baseline="auto" transform="rotate(0 0 -59.2)" font-size="12" font-family="inherit">100 Meters</text><text data-ts-key="angle-label:string:9:Long Jump" fill="#808080" x="59.2" y="1.1" text-anchor="start" dominant-baseline="middle" transform="rotate(0 59.2 1.1)" font-size="12" font-family="inherit">Long Jump</text><text data-ts-key="angle-label:string:9:High Jump" fill="#808080" x="0" y="58.1" text-anchor="middle" dominant-baseline="hanging" transform="rotate(0 0 58.1)" font-size="12" font-family="inherit">High Jump</text><text data-ts-key="angle-label:string:17:100 Meter Hurdles" fill="#808080" x="-59.2" y="1.1" text-anchor="end" dominant-baseline="middle" transform="rotate(0 -59.2 1.1)" font-size="12" font-family="inherit">100 Meter Hurdles</text></g></g></g></svg>