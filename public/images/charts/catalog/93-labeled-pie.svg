<svg xmlns="http://www.w3.org/2000/svg" class="ts-chart" width="100%" height="100%" viewBox="0 0 288 192" role="img" aria-roledescription="chart" aria-label="Letter frequency pie with labels" tabindex="-1" style="display:block;overflow:visible"><style>.ts-chart__legend{display:none}.ts-chart text{font-size:9px}:root{--ts-chart-background:#ffffff;--ts-chart-foreground:#071219;--ts-chart-muted:#667c87;--ts-chart-1:#2497bd;--ts-chart-2:#e46244;--ts-chart-3:#39a84b;--ts-chart-4:#805ad5;--ts-chart-5:#e69a16;--ts-chart-6:#667c87;color:#071219}.ts-chart__grid{stroke:#071219;stroke-opacity:0.1}.ts-chart__axes line,.ts-chart__axes path{stroke:#071219;stroke-opacity:0.32}.ts-chart__axes text{fill:#071219;fill-opacity:0.6}@media(prefers-color-scheme:dark){:root{--ts-chart-background:#071219;--ts-chart-foreground:#d9edf1;--ts-chart-muted:#91a9b4;--ts-chart-1:#61e8ff;--ts-chart-2:#ff806f;--ts-chart-3:#b9f227;--ts-chart-4:#c4a7ff;--ts-chart-5:#ffd85e;--ts-chart-6:#91a9b4;color:#d9edf1}.ts-chart__grid{stroke:#d9edf1;stroke-opacity:0.13}.ts-chart__axes line,.ts-chart__axes path{stroke:#d9edf1;stroke-opacity:0.28}.ts-chart__axes text{fill:#d9edf1;fill-opacity:0.62}}</style><g data-ts-key="marks" class="ts-chart__marks"><g data-ts-key="polar-0" class="ts-chart__polar" aria-hidden="true" transform="translate(144 96)"><g data-ts-key="letter-slices" class="ts-chart__arc" aria-hidden="true"><path data-ts-key="letter-slices:object:null:string:1:E" fill="#2563eb" stroke-linejoin="round" d="M0,-53.76A53.76,53.76,0,0,1,45.511,28.616L0,0Z" vector-effect="non-scaling-stroke"/><path data-ts-key="letter-slices:object:null:string:1:T" fill="#7c3aed" stroke-linejoin="round" d="M45.511,28.616A53.76,53.76,0,0,1,-26.273,46.903L0,0Z" vector-effect="non-scaling-stroke"/><path data-ts-key="letter-slices:object:null:string:1:A" fill="#db2777" stroke-linejoin="round" d="M-26.273,46.903A53.76,53.76,0,0,1,-51.186,-16.436L0,0Z" vector-effect="non-scaling-stroke"/><path data-ts-key="letter-slices:object:null: