<svg xmlns="http://www.w3.org/2000/svg" class="ts-chart" width="100%" height="100%" viewBox="0 0 288 192" role="img" aria-roledescription="chart" aria-label="Selectable penguin measurement chart" tabindex="0" style="display:block;overflow:visible"><style>.ts-chart__legend{display:none}.ts-chart text{font-size:9px}:root{--ts-chart-background:#ffffff;--ts-chart-foreground:#071219;--ts-chart-muted:#667c87;--ts-chart-1:#2497bd;--ts-chart-2:#e46244;--ts-chart-3:#39a84b;--ts-chart-4:#805ad5;--ts-chart-5:#e69a16;--ts-chart-6:#667c87;color:#071219}.ts-chart__grid{stroke:#071219;stroke-opacity:0.1}.ts-chart__axes line,.ts-chart__axes path{stroke:#071219;stroke-opacity:0.32}.ts-chart__axes text{fill:#071219;fill-opacity:0.6}@media(prefers-color-scheme:dark){:root{--ts-chart-background:#071219;--ts-chart-foreground:#d9edf1;--ts-chart-muted:#91a9b4;--ts-chart-1:#61e8ff;--ts-chart-2:#ff806f;--ts-chart-3:#b9f227;--ts-chart-4:#c4a7ff;--ts-chart-5:#ffd85e;--ts-chart-6:#91a9b4;color:#d9edf1}.ts-chart__grid{stroke:#d9edf1;stroke-opacity:0.13}.ts-chart__axes line,.ts-chart__axes path{stroke:#d9edf1;stroke-opacity:0.28}.ts-chart__axes text{fill:#d9edf1;fill-opacity:0.62}}</style><desc>Use arrow keys to choose a penguin and Enter or Space to pin a same-species comparison.</desc><g data-ts-key="grid" class="ts-chart__grid" aria-hidden="true" stroke="currentColor" stroke-opacity="0.11" stroke-width="1"><line data-ts-key="y-grid:number:3000" x1="68" y1="150" x2="264" y2="150"/><line data-ts-key="y-grid:number:3500" x1="68" y1="128" x2="264" y2="128"/><line data-ts-key="y-grid:number:4000" x1="68" y1="106" x2="264" y2="106"/><line data-ts-key="y-grid:number:4500" x1="68" y1="84" x2="264" y2="84"/><line data-ts-key="y-grid:number:5000" x1="68" y1="62" x2="264" y2="62"/><line data-ts-key="y-grid:number:5500" x1="68" y1="40" x2="264" y2="40"/><line data-ts-key="y-grid:number:6000" x1="68" y1="18" x2="264" y2="18"/></g><g data-ts-key="marks" class="ts-chart__marks"><g data-ts-key="penguins" cla