<svg xmlns="http://www.w3.org/2000/svg" width="640" height="266" viewBox="0 0 640 266" role="img" aria-labelledby="mte-title mte-desc">
  <title id="mte-title">Replacing the current transaction does not stop the loader flight</title>
  <desc id="mte-desc">
    Three rows on a shared timeline. The current transaction belongs to /account
    until the user clicks /settings, after which /settings holds it. The /account
    lane stops at that moment and can no longer publish. The /account loader
    flight crosses the same moment and keeps running until it settles into the
    cache, because the preload still holds a lease on it.
  </desc>
  <style>
    :root {
      background-color: #fdfdfd;
    }

    text {
      fill: #4c4c4c;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 14px;
    }

    .mono {
      font-family: ui-monospace, "Monaspace Neon NF", Menlo, monospace;
    }

    .note {
      font-size: 12.5px;
    }

    .tick {
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    .bar {
      fill: none;
      stroke-width: 9;
      stroke-linecap: round;
    }

    .guide {
      fill: none;
      stroke: #a7a7a7;
      stroke-width: 1.4;
      stroke-dasharray: 3 4;
    }

    .node {
      fill: #0a0a0a;
      stroke-width: 4;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        background-color: #0a0a0a;
      }

      text {
        fill: #b3b3b3;
      }
    }
  </style>
  <defs>
    <marker id="mte-arrow-pink" viewBox="0 0 10 10" refX="7" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#db81dd" />
    </marker>
  </defs>

  <text class="tick" x="620" y="28" text-anchor="end">TIME →</text>

  <path class="guide" d="M370 40V236" />
  <text class="note" x="370" y="28" text-anchor="middle">click /settings</text>

  <!-- current transaction -->
  <text x="160" y="77" text-anchor="end">current transaction</text>
  <path class="bar" stroke="#db81dd" d="M190 72h162" />
  <path class="bar" stroke="#db81dd" marker-end="url(#mte-arrow-pink)" d="M388 72h206" />
  <circle class="node" stroke="#db81dd" cx="190" cy="72" r="6" />
  <circle class="node" stroke="#db81dd" cx="352" cy="72" r="6" />
  <circle class="node" stroke="#db81dd" cx="388" cy="72" r="6" />
  <text class="mono" x="271" y="50" text-anchor="middle">/account</text>
  <text class="mono" x="496" y="50" text-anchor="middle">/settings</text>

  <!-- account lane -->
  <text x="160" y="147" text-anchor="end">/account lane</text>
  <path class="bar" stroke="#60d9d8" d="M190 142h162" />
  <circle class="node" stroke="#60d9d8" cx="190" cy="142" r="6" />
  <circle class="node" stroke="#60d9d8" cx="352" cy="142" r="6" />
  <text class="note" x="392" y="147">discarded, may never publish</text>

  <!-- account flight -->
  <text x="160" y="217" text-anchor="end">/account flight</text>
  <path class="bar" stroke="#e2b027" d="M232 212h328" />
  <circle class="node" stroke="#e2b027" cx="232" cy="212" r="6" />
  <circle class="node" stroke="#e2b027" cx="560" cy="212" r="6" />
  <text class="note" x="232" y="192">loader runs</text>
  <text class="note mono" x="560" y="192" text-anchor="end">settles → cache</text>
  <text class="note" x="396" y="252" text-anchor="middle">the preload's lease keeps it alive</text>
</svg>
