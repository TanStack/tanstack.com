<svg xmlns="http://www.w3.org/2000/svg" class="ts-chart" width="100%" height="100%" viewBox="0 0 288 192" role="img" aria-roledescription="chart" aria-label="Primary and comparison series with spring motion" tabindex="-1" style="display:block;overflow:visible"><style>.ts-chart__legend{display:none}.ts-chart text{font-size:9px}:root{--ts-chart-background:#ffffff;--ts-chart-foreground:#071219;--ts-chart-muted:#667c87;--ts-chart-1:#2497bd;--ts-chart-2:#e46244;--ts-chart-3:#39a84b;--ts-chart-4:#805ad5;--ts-chart-5:#e69a16;--ts-chart-6:#667c87;color:#071219}.ts-chart__grid{stroke:#071219;stroke-opacity:0.1}.ts-chart__axes line,.ts-chart__axes path{stroke:#071219;stroke-opacity:0.32}.ts-chart__axes text{fill:#071219;fill-opacity:0.6}@media(prefers-color-scheme:dark){:root{--ts-chart-background:#071219;--ts-chart-foreground:#d9edf1;--ts-chart-muted:#91a9b4;--ts-chart-1:#61e8ff;--ts-chart-2:#ff806f;--ts-chart-3:#b9f227;--ts-chart-4:#c4a7ff;--ts-chart-5:#ffd85e;--ts-chart-6:#91a9b4;color:#d9edf1}.ts-chart__grid{stroke:#d9edf1;stroke-opacity:0.13}.ts-chart__axes line,.ts-chart__axes path{stroke:#d9edf1;stroke-opacity:0.28}.ts-chart__axes text{fill:#d9edf1;fill-opacity:0.62}}</style><g data-ts-key="marks" class="ts-chart__marks"><g data-ts-key="primary:object:null" class="ts-chart__line" aria-hidden="true"><path data-ts-key="primary:object:null:segment:0" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M41.14,133.44L75.43,113.28L109.71,123.36L144,93.12L178.29,100.32L212.57,72.96L246.86,80.16" vector-effect="non-scaling-stroke"/></g><g data-ts-key="comparison:object:null" class="ts-chart__line" aria-hidden="true"><path data-ts-key="comparison:object:null:segment:0" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M41.14,119.04L75.43,110.4L109.71,101.76L144,97.44L178.29,85.92L212.57,78.72L246.86,67.2" vector-effect="non-scaling-stroke"/></g></g></svg>